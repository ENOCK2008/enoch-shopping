
{% if ads %}
<section class="esc-ad-section" aria-label="Sponsored advertisements">
    <div class="esc-ad-heading">
        <div>
            <span class="esc-ad-eyebrow">DISCOVER MORE</span>
            <h2>Sponsored for You</h2>
            <p>Discover products and offers from businesses on Enock Shopping Center.</p>
        </div>
        <span class="esc-ad-label">
            <i class="fas fa-bullhorn"></i> Sponsored
        </span>
    </div>

    <div class="esc-ad-grid">
        {% for ad in ads %}
        <article class="esc-ad-card">
            <a href="{% url 'advertising:click' ad.id %}"
               class="esc-ad-link"
               rel="sponsored"
               aria-label="View {{ ad.title }}">

                <div class="esc-ad-image-wrap">
                    <img
                        src="{{ ad.image.url }}"
                        alt="{{ ad.title }}"
                        class="esc-ad-image"
                        loading="lazy"
                    >
                    <span class="esc-ad-badge">
                        <i class="fas fa-star"></i> Sponsored
                    </span>
                </div>

                <div class="esc-ad-content">
                    <h3>{{ ad.title }}</h3>

                    {% if ad.description %}
                    <p>{{ ad.description|truncatechars:105 }}</p>
                    {% endif %}

                    <span class="esc-ad-cta">
                        Discover Offer
                        <i class="fas fa-arrow-right"></i>
                    </span>
                </div>
            </a>
        </article>
        {% endfor %}
    </div>
</section>

<style>
.esc-ad-section {
    margin: 32px auto;
    max-width: 1440px;
    padding: 24px;
    border-radius: 20px;
    background: var(--esc-ad-background, #f5f7ff);
    font-family: inherit;
}

.esc-ad-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 22px;
}

.esc-ad-eyebrow {
    color: #6454d9;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
}

.esc-ad-heading h2 {
    margin: 5px 0;
    font-size: clamp(21px, 3vw, 29px);
    font-weight: 800;
    color: #172033;
}

.esc-ad-heading p {
    margin: 0;
    color: #667085;
    font-size: 14px;
}

.esc-ad-label {
    flex-shrink: 0;
    padding: 8px 12px;
    border-radius: 30px;
    background: #e8e5ff;
    color: #5141bd;
    font-size: 12px;
    font-weight: 700;
}

.esc-ad-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
}

.esc-ad-card {
    overflow: hidden;
    min-width: 0;
    background: #fff;
    border: 1px solid #e7eaf2;
    border-radius: 16px;
    box-shadow: 0 5px 18px rgba(30, 41, 59, .05);
    transition: transform .2s ease, box-shadow .2s ease;
}

.esc-ad-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 26px rgba(30, 41, 59, .12);
}

.esc-ad-link {
    display: block;
    height: 100%;
    color: inherit;
    text-decoration: none;
}

.esc-ad-image-wrap {
    position: relative;
    overflow: hidden;
    background: #edf0f8;
}

.esc-ad-image {
    display: block;
    width: 100%;
    height: 210px;
    object-fit: cover;
    transition: transform .3s ease;
}

.esc-ad-card:hover .esc-ad-image {
    transform: scale(1.04);
}

.esc-ad-badge {
    position: absolute;
    left: 12px;
    top: 12px;
    padding: 6px 10px;
    background: rgba(255,255,255,.96);
    border-radius: 7px;
    color: #4338a8;
    font-size: 11px;
    font-weight: 800;
}

.esc-ad-content {
    padding: 17px;
}

.esc-ad-content h3 {
    margin: 0 0 9px;
    color: #172033;
    font-size: 17px;
    font-weight: 750;
    overflow-wrap: anywhere;
}

.esc-ad-content p {
    margin: 0 0 16px;
    color: #667085;
    font-size: 13px;
    line-height: 1.65;
}

.esc-ad-cta {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    color: #5141bd;
    font-size: 13px;
    font-weight: 800;
}

@media (max-width: 800px) {
    .esc-ad-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
    }

    .esc-ad-section {
        padding: 16px;
    }

    .esc-ad-image {
        height: 165px;
    }
}

@media (max-width: 480px) {
    .esc-ad-grid {
        grid-template-columns: 1fr;
    }

    .esc-ad-heading {
        align-items: flex-start;
    }

    .esc-ad-heading p {
        max-width: 240px;
    }

    .esc-ad-image {
        height: 210px;
    }
}
</style>
{% endif %}
