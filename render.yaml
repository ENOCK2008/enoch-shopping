services:
  - type: web
    name: enock-shopping-center
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: "/health/"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: enock-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "enock-shopping-center.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://enock-shopping-center.onrender.com"

databases:
  - name: enock-db
    databaseName: enock
    user: enock
    plan: free
