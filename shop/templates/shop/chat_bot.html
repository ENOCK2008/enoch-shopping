{% extends 'shop/base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/styles.css' %}">
<div class="container chat-bot-container">
    <h1>Chat Bot</h1>
    <p>Welcome to our chat bot! How can we assist you today?</p>
    
    <div class="chat-window">
        <div class="chat-messages" id="chat-messages">
            <!-- Messages will be displayed here -->
        </div>
        <div class="chat-input-container">
            <input type="text" id="user-input" placeholder="Type your message..." class="chat-input">
            <button id="send-button" class="btn btn-primary">Send</button>
        </div>
    </div>
</div>

<script>
    document.getElementById('send-button').addEventListener('click', function() {
        const userInput = document.getElementById('user-input').value;
        if (userInput) {
            // Display user message
            const messagesContainer = document.getElementById('chat-messages');
            const userMessage = document.createElement('div');
            userMessage.className = 'message user-message';
            userMessage.textContent = userInput;
            messagesContainer.appendChild(userMessage);
            
            // Clear input field
            document.getElementById('user-input').value = '';

            // Simulate bot response (this can be replaced with actual bot logic)
            const botMessage = document.createElement('div');
            botMessage.className = 'message bot-message';
            botMessage.textContent = 'This is a simulated response. You said: ' + userInput;
            messagesContainer.appendChild(botMessage);
            
            // Scroll to the bottom of the chat
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    });
</script>

<style>
    .chat-bot-container {
        max-width: 600px;
        margin: 20px auto;
        padding: 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background-color: #f9f9f9;
    }
    .chat-window {
        display: flex;
        flex-direction: column;
        height: 400px;
        border: 1px solid #ddd;
        border-radius: 8px;
        overflow: hidden;
    }
    .chat-messages {
        flex: 1;
        padding: 10px;
        overflow-y: auto;
        border-bottom: 1px solid #ddd;
    }
    .message {
        margin: 5px 0;
        padding: 10px;
        border-radius: 4px;
        max-width: 80%;
    }
    .user-message {
        background-color: #e0f7fa;
        align-self: flex-end;
    }
    .bot-message {
        background-color: #c8e6c9;
        align-self: flex-start;
    }
    .chat-input-container {
        display: flex;
        padding: 10px;
    }
    .chat-input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 4px;
        margin-right: 10px;
    }
    .btn-primary {
        padding: 10px 20px;
    }
</style>
{% endblock %}
