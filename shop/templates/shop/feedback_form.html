{% extends 'shop/base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/styles.css' %}"> <!-- Link to your external CSS file if available -->

<div class="container mt-5 feedback-section">
    <h2 class="section-title mb-4">We Value Your Feedback</h2>
    <form method="post" class="feedback-form">
        {% csrf_token %}
        <div class="form-group mb-4">
            <label for="feedback" class="form-label">Your Feedback:</label>
            <textarea name="feedback" id="feedback" rows="4" class="form-control feedback-input" placeholder="Share your thoughts..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary feedback-btn">Submit Feedback</button>
    </form>
</div>

<style>
    body {
        background-color: #f4f4f4; /* Light background for contrast */
        color: #333; /* Dark text for readability */
        font-family: 'Roboto', sans-serif; /* Clean font */
        line-height: 1.6; /* Improved line height */
    }

    .container {
        max-width: 800px; /* Limit container width */
        margin: auto; /* Center the container */
        padding: 20px; /* Padding around the container */
        background-color: #fff; /* White background for the form */
        border-radius: 8px; /* Rounded corners */
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); /* Subtle shadow */
    }

    .section-title {
        text-align: center; /* Centered title */
        color: #007bff; /* Blue color for title */
        font-size: 2em; /* Larger title size */
        margin-bottom: 20px; /* Space below the title */
    }

    .form-label {
        font-weight: bold; /* Bold labels for clarity */
    }

    .form-group {
        margin-bottom: 1.5em; /* Spacing between form groups */
    }

    .feedback-input {
        resize: none; /* Prevent resizing of textarea */
        border: 1px solid #ccc; /* Border color */
        border-radius: 5px; /* Rounded corners for input */
        transition: border-color 0.3s; /* Smooth transition */
    }

    .feedback-input:focus {
        border-color: #007bff; /* Change border color on focus */
        outline: none; /* Remove default outline */
        box-shadow: 0 0 5px rgba(0, 123, 255, 0.5); /* Subtle glow effect */
    }

    .feedback-btn {
        width: 100%; /* Full-width button */
        padding: 10px; /* Padding for button */
        font-size: 1.2em; /* Larger font size for button */
        border-radius: 5px; /* Rounded corners */
        transition: background-color 0.3s; /* Smooth transition */
    }

    .feedback-btn:hover {
        background-color: #0056b3; /* Darker blue on hover */
        cursor: pointer; /* Pointer cursor on hover */
    }

    @media (max-width: 600px) {
        .container {
            padding: 15px; /* Less padding on smaller screens */
        }

        .section-title {
            font-size: 1.5em; /* Smaller title size on small screens */
        }
    }
</style>

{% endblock %}
