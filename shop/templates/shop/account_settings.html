{% extends "shop/base.html" %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center mb-4">Account Settings</h1>

    <form method="POST" action="{% url 'shop:update_account_settings' %}" class="border p-4 rounded shadow">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" value="{{ user.username }}" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" value="{{ user.email }}" required>
        </div>

        <div class="form-group">
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" name="first_name" class="form-control" value="{{ user.first_name }}">
        </div>

        <div class="form-group">
            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" name="last_name" class="form-control" value="{{ user.last_name }}">
        </div>

        <div class="form-group">
            <label for="password">Change Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Leave blank to keep current password">
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Leave blank to keep current password">
        </div>

        <div class="form-group">
            <label for="profile_picture">Profile Picture</label>
            <input type="file" id="profile_picture" name="profile_picture" class="form-control-file">
            <small class="form-text text-muted">Upload a new profile picture (optional).</small>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Update Settings</button>
    </form>

    <div class="text-center mt-4">
        <a href="{% url 'shop:delete_account' %}" class="btn btn-danger">Delete Account</a>
    </div>
</div>
{% endblock %}
