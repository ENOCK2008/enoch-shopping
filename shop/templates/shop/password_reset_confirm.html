{% extends "base.html" %}

{% block title %}
Set New Password
{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/styles.css' %}">
<div class="container">
    <h2>Set New Password</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Set New Password</button>
    </form>
    <p><a href="{% url 'login' %}">Back to login</a></p>
</div>
{% endblock %}
