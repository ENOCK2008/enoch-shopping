{% extends 'shop/base.html' %}

{% block content %}
<div class="container mt-5">
    <h1 class="text-center mb-4">Exclusive Offers</h1>

    <div class="row">
        {% for offer in offers %}
        <div class="col-md-4 mb-4">
            <div class="card shadow-sm border-light">
                <img src="{{ offer.image.url }}" class="card-img-top" alt="{{ offer.title }}">
                <div class="card-body">
                    <h5 class="card-title">{{ offer.title }}</h5>
                    <p class="card-text">{{ offer.description|truncatewords:20 }}</p>
                    <p class="text-danger font-weight-bold">${{ offer.price }}</p>
                    <a href="{% url 'shop:offer_detail' offer.id %}" class="btn btn-primary">View Offer</a>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12">
            <div class="alert alert-warning text-center" role="alert">
                No offers available at the moment.
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
