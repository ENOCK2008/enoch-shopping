<!DOCTYPE html>
<html>
<head>
    <title>Delete Discount Code</title>
</head>
<body>
    <h1>Delete Discount Code</h1>
    <form method="post">
        {% csrf_token %}
        <p>Are you sure you want to delete "{{ discount_code.code }}"?</p>
        <button type="submit">Delete</button>
        <a href="{% url 'shop:discount_code_list' %}">Cancel</a>
    </form>
</body>
</html>
