{% extends 'shop/base.html' %}
{% load static %}

{% block title %}Delete Discount Code{% endblock %}

{% block content %}
<h1>Delete Discount Code</h1>
<p>Are you sure you want to delete the discount code "{{ discount_code.code }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'some_redirect_view' %}">Cancel</a>
</form>
{% endblock %}
