<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deactivate Account | Enock Shopping Center</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">

    <!-- Inline CSS for the template -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h2 {
            color: #343a40;
            margin-bottom: 1rem;
        }

        p {
            color: #495057;
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-container {
            max-width: 400px;
            padding: 2rem;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        button {
            background-color: #dc3545; /* Bootstrap danger color */
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
        }

        button:hover {
            background-color: #c82333; /* Darker shade of red */
        }

        a {
            color: #007bff;
            text-decoration: none;
            margin-top: 1rem;
            display: inline-block;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Deactivate Your Account</h2>
        
        <p>Are you sure you want to deactivate your account? This action cannot be undone.</p>
        
        <form method="POST">
            {% csrf_token %}
            <button type="submit">Deactivate Account</button>
        </form>
        
        <p><a href="{% url 'shop:home' %}">Cancel</a></p>
    </div>
</body>
</html>
