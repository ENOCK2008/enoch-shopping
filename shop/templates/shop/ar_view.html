<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} - AR View</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">  <!-- Optional: Add your CSS styles -->
    <link rel="icon" href="{% static 'path/to/favicon.ico' %}" type="image/x-icon"> <!-- Favicon -->
    <script src="{% static 'path/to/aframe.min.js' %}"></script>
    <script src="{% static 'path/to/aframe-ar.js' %}"></script>
    <style>
        :root {
            --primary-color: #3498db; /* Example of CSS variable */
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;  /* Added font for better readability */
        }
        header {
            text-align: center;
            margin: 20px 0;
        }
        h1 {
            color: #333;  /* Optional: Improved text color */
        }
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        a-scene {
            width: 100%;
            height: 100%;
        }
        /* Optional: Loading spinner style */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none; /* Hidden by default */
        }
    </style>
</head>
<body>
    <header>
        <h1>Augmented Reality View of {{ product.name }}</h1>
    </header>
    
    <main>
        <a-scene embedded arjs>
            <a-marker preset="hiro">
                <a-entity
                    geometry="primitive: box"
                    material="color: red"
                    scale="0.5 0.5 0.5"
                    position="0 0 0"
                ></a-entity>
                {% if product.panoramic_image %}
                    <a-entity
                        gltf-model="{{ product.panoramic_image.url }}"
                        scale="1 1 1"
                        position="0 0.5 0"
                        animation-mixer  <!-- Optional: Add this for animations if needed -->
                    ></a-entity>
                {% else %}
                    <!-- Optional: Placeholder if no panoramic image is available -->
                    <a-entity
                        geometry="primitive: box"
                        material="color: grey"
                        scale="1 1 1"
                        position="0 0.5 0"
                    ></a-entity>
                {% endif %}
            </a-marker>
            <a-entity camera></a-entity>
        </a-scene>
        <div class="loading">Loading AR content...</div> <!-- Loading indicator -->
    </main>

    <script>
        // Show loading indicator
        const loadingIndicator = document.querySelector('.loading');
        loadingIndicator.style.display = 'block'; // Show loading indicator
        
        // Optional: Add any additional JavaScript functionality here
        document.querySelector('a-scene').addEventListener('enter-vr', function() {
            console.log('Entering AR mode');
            loadingIndicator.style.display = 'none'; // Hide loading indicator
        });
    </script>
</body>
</html>
