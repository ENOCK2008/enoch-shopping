<!DOCTYPE html>
<html>
<head>
    <title>AR View</title>
    <script src="{% static 'path/to/aframe.min.js' %}"></script>
    <script src="{% static 'path/to/aframe-ar.js' %}"></script>
</head>
<body>
    <a-scene embedded arjs>
        <a-marker preset="hiro">
            <a-entity
                geometry="primitive: box"
                material="color: red"
                scale="0.5 0.5 0.5"
                position="0 0 0"
            ></a-entity>
            <a-entity
                position="0 0.5 0"
                gltf-model="{% static product.panoramic_image.url %}">
            </a-entity>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
