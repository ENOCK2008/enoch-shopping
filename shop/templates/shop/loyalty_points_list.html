<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Loyalty Points</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header>
        <nav>
            <ul class="nav-list">
                <li><a href="{% url 'shop:home' %}" class="nav-button">Home</a></li>
                <!-- Add additional navigation items here -->
            </ul>
        </nav>
    </header>

    <div class="form-container">
        <h1>Update Loyalty Points</h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="points">Points to Add:</label>
                <input type="number" id="points" name="points" min="1" required>
            </div>
            <button type="submit" class="btn btn-primary">Update Points</button>
        </form>
    </div>

    <footer>
        <div class="footer-container">
            <h2>Contact Us</h2>
            <section class="contact-info">
                <address>
                    <p>Email: <a href="mailto:info@enochshopping.com">info@enochshopping.com</a></p>
                    <p>Phone: (256) 756679314</p>
                    <p>Address: Kampala, Uganda, Shopping City.</p>
                </address>
            </section>
            <p>&copy; 2024 Enock Shopping Center. All rights reserved.</p>
            <p>
                <a href="{% url 'shop:contact' %}">Contact Us</a> | 
                <a href="{% url 'shop:about' %}">About Us</a>
            </p>
        </div>
    </footer>
</body>
</html>
