{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room: {{ room_name }}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="manifest" href="{% static 'js/manifest.json' %}">
    <script src="{% static 'js/script.js' %}"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0; 
        }

        header {
            background-color: #007bff; 
            padding: 15px; 
            text-align: center; 
        }

        h1 {
            color: white; 
            margin: 0; 
        }

        nav {
            display: flex;
            justify-content: center; 
            margin-top: 10px; 
        }

        .nav-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex; 
        }

        .nav-button {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 5px;
            margin: 0 5px;
            transition: background-color 0.3s; 
        }

        .nav-button:hover {
            background-color: #0056b3; 
        }

        main {
            padding: 20px; 
        }

        #chat-log {
            border: 1px solid #ccc;
            height: 400px;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #f9f9f9; 
            border-radius: 5px; 
        }

        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px; 
        }

        .message.user {
            background-color: #b2ebf2; 
            text-align: right;
        }

        .message.bot {
            background-color: #ffccbc; 
            text-align: left;
        }

        #chat-message-input {
            width: 80%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px; 
        }

        #chat-message-submit {
            width: 18%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s; 
        }

        #chat-message-submit:hover {
            background-color: #0056b3; 
        }

        #room-selector-form {
            margin-bottom: 10px;
        }

        #typing-status {
            font-style: italic;
            color: #999;
        }

        #status {
            font-weight: bold; 
            color: white; 
        }

        @media (max-width: 600px) {
            #chat-message-input {
                width: 70%; 
            }
            #chat-message-submit {
                width: 28%; 
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to the Chat Room</h1>
        <nav>
            <ul class="nav-list">
                <li><a href="{% url 'shop:home' %}" class="nav-button">Home</a></li>
                <li><a href="{% url 'shop:logout' %}" class="nav-button">Logout</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Chat Room: {{ room_name }}</h1>
        <div id="status"></div>
        <div id="typing-status"></div>
        <div id="chat-log"></div>

        <form id="room-selector-form">
            <input id="room-name-input" type="text" placeholder="Enter new room name..." />
            <button type="submit" class="nav-button">Change Room</button>
        </form>

        <input id="chat-message-input" type="text" placeholder="Type your message..." />
        <button id="chat-message-submit">Send</button>
    </main>
</body>
</html>
