<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room: {{ room_name }}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="manifest" href="{% static 'manifest.json' %}">  <!-- Adjust as necessary -->

    <script>
        let chatSocket;
        let roomName = "{{ room_name }}"; // Initialize with the room name passed from the server

        function registerServiceWorker() {
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('{% static "js/serviceworker.js" %}').then(function(registration) {
                        console.log('Service Worker registered with scope:', registration.scope);
                    }).catch(function(error) {
                        console.log('Service Worker registration failed:', error);
                    });
                });
            }
        }

        function updateStatus(message) {
            const statusElement = document.querySelector('#status');
            if (statusElement) {
                statusElement.textContent = message;
            }
        }

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            chatSocket = new WebSocket(protocol + window.location.host + '/ws/chat/' + encodeURIComponent(roomName) + '/');
            console.log('Connecting to:', protocol + window.location.host + '/ws/chat/' + encodeURIComponent(roomName) + '/');
            chatSocket.onopen = function() {
                console.log('WebSocket connection established');
                updateStatus('Connected to room: ' + roomName);
            };

            chatSocket.onmessage = function(e) {
                const data = JSON.parse(e.data);
                const messageElement = document.createElement('div');
                const messageTime = new Date().toLocaleTimeString();

                // Assign class based on whether the message is from a bot or user
                messageElement.className = data.is_bot ? 'message bot' : 'message user';
                messageElement.innerHTML = `<strong>[${messageTime}]</strong> ${data.message}`;

                const chatLog = document.querySelector('#chat-log');
                if (chatLog) {
                    chatLog.appendChild(messageElement);
                    chatLog.scrollTop = chatLog.scrollHeight; // Scroll to bottom
                }
            };

            chatSocket.onerror = function(e) {
                console.error('WebSocket error:', e);
                updateStatus('Connection error. Attempting to reconnect...');
            };

            chatSocket.onclose = function(e) {
                console.error('Chat socket closed unexpectedly', e);
                updateStatus('Disconnected. Attempting to reconnect...');
                setTimeout(connectWebSocket, 2000); // Reconnect after 2 seconds
            };
        }

        // Handle room joining
        document.addEventListener('DOMContentLoaded', function() {
            registerServiceWorker();
            connectWebSocket();

            const roomSelectorForm = document.getElementById('room-selector-form');
            roomSelectorForm.onsubmit = function(e) {
                e.preventDefault(); // Prevent form submission

                const newRoomName = document.getElementById('room-name-input').value.trim();
                if (newRoomName && newRoomName !== roomName) {
                    roomName = newRoomName; // Update the room name
                    chatSocket.close(); // Close the current WebSocket connection
                    connectWebSocket(); // Connect to the new room
                }
            };

            // Send message when the button is clicked
            document.querySelector('#chat-message-submit').onclick = function() {
                const messageInput = document.querySelector('#chat-message-input');
                const message = messageInput.value.trim();

                const MAX_MESSAGE_LENGTH = 200; // Set your desired max message length

                if (message && message.length <= MAX_MESSAGE_LENGTH) {
                    if (chatSocket.readyState === WebSocket.OPEN) {
                        chatSocket.send(JSON.stringify({ 'message': message }));
                        messageInput.value = ''; // Clear input after sending
                    } else {
                        console.error('WebSocket is not open. Current state:', chatSocket.readyState);
                    }
                } else {
                    alert(`Message must be under ${MAX_MESSAGE_LENGTH} characters.`);
                }
            };

            // Send message on 'Enter' key press
            document.addEventListener('keypress', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault(); // Prevent form submission
                    document.querySelector('#chat-message-submit').click();
                }
            });
        });
    </script>

    <style>
        #chat-log {
            border: 1px solid #ccc;
            height: 400px;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
        }
        .message {
            margin-bottom: 10px;
            padding: 5px;
            border-radius: 5px;
        }
        .message.user {
            background-color: #e1f5fe;
            text-align: right;
        }
        .message.bot {
            background-color: #f1f1f1;
            text-align: left;
        }
        #chat-message-input {
            width: 80%;
            padding: 10px;
        }
        #chat-message-submit {
            width: 18%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #chat-message-submit:hover {
            background-color: #0056b3;
        }
        #room-selector-form {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul class="nav-list">
                <li><a href="{% url 'shop:home' %}" class="nav-button">Home</a></li>
                <li><a href="{% url 'shop:shop' %}" class="nav-button">Shop</a></li>
                <li><a href="{% url 'shop:about' %}" class="nav-button">About</a></li>
                <li><a href="{% url 'shop:contact' %}" class="nav-button">Contact</a></li>
                <li><a href="{% url 'shop:login' %}" class="nav-button">Login</a></li>
                <li><a href="{% url 'shop:chat_room' room_name='general' %}" class="nav-button">Chat Room</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <form id="room-selector-form">
            <input type="text" id="room-name-input" placeholder="Enter chat room name" value="{{ room_name }}" required>
            <button type="submit">Join Room</button>
        </form>

        <h2>Chat Room: <span id="current-room-name">{{ room_name }}</span></h2>
        <div id="chat-log"></div>
        <input id="chat-message-input" type="text" size="100" placeholder="Type your message...">
        <button id="chat-message-submit">Send</button>
        <p id="status"></p>
    </main>
</body>
</html>
